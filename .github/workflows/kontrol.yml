# Her PR'da ve main'e her push'ta: yasaklı dosya kontrolü → testler (F0-05).
# Gerçek veri ve .env GitHub'da yoktur; testler yalnızca sahte veriyle çalışır. Ağır testler (BERT, embedding)
# atlanır (pytest.ini, AGIR_TESTLER); Hugging Face modelleri indirilmez.
name: kontrol

on:
  pull_request:
  push:
    branches: [main, "gorev/**"]     # görev dalına her push'ta da: PR açmadan önce sonuç görülür
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yasakli-dosyalar:
    name: Yasaklı dosya ve gizli bilgi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python .github/kontrol.py

  testler:
    name: Ruff ve testler (sahte veri)
    needs: yasakli-dosyalar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Paketler (PyTorch yalnızca CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Kod stili
        run: ruff check .
      - name: Sahte veri hazırlığı
        run: |
          python hazirlama/ozellik_cikar.py sahte
          python calistir.py --veri sahte --sadece kalip,stok,durum,tavsiye,kart
      - name: Paket sürümleri
        run: python -c "import importlib.metadata as m; print('::notice title=Sürümler::' + ', '.join(f'{p} {m.version(p)}' for p in ['numpy','pandas','scikit-learn','lightgbm','torch','streamlit','duckdb','anthropic']))"
      - name: Testler
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=line 2>&1 | tee pytest.log
      - name: Düşen testleri uyarı olarak yaz
        if: failure()
        shell: bash
        run: |
          # Uyarılar (annotations) giriş yapmadan da okunabilir; günlüğün tamamı giriş ister
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r satir; do
            echo "::error title=Test::${satir:0:900}"
          done
          grep -E "^(E  |/.*:[0-9]+: )" pytest.log | head -10 | while IFS= read -r satir; do
            echo "::warning title=Ayrıntı::${satir:0:900}"
          done
